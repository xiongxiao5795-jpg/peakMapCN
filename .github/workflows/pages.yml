name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-website
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test and build website
        run: |
          npm ci
          npm test
          npm run build
      - name: Check out public website repository
        uses: actions/checkout@v4
        with:
          repository: xiongxiao5795-jpg/peakmapcn-web
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: .pages-publish
      - name: Publish static files
        run: |
          find .pages-publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. .pages-publish/
          touch .pages-publish/.nojekyll
          git -C .pages-publish config user.name 'github-actions[bot]'
          git -C .pages-publish config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C .pages-publish add -A
          if git -C .pages-publish diff --cached --quiet; then exit 0; fi
          git -C .pages-publish commit -m "Deploy ${GITHUB_SHA}"
          git -C .pages-publish push origin HEAD:main
